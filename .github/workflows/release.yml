name: Release

# Publish @bound/sdk and @bound/mcp to npm. Only fires on version tags — never
# on push/PR — so publishing stays a deliberate, tag-triggered act by the
# maintainer.
#
# The tag names the SDK's version. @bound/mcp carries its own, and rides along:
# it depends on the SDK, so shipping the two from one tag is the only way to
# guarantee a published connector cannot reference an SDK version that does not
# exist yet.
on:
  push:
    tags:
      - "v*"

# Least privilege: read the repo, and mint an OIDC token for npm provenance.
# No other job in this workflow needs write access to anything.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Reads packageManager from package.json (pnpm@10.27.0).

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Pin matches rust-toolchain.toml, same as ci.yml — `pnpm verify` runs the
      # contract fmt/clippy/test steps too, so this job needs Rust as well as Node.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Trusted Publishing (OIDC) needs npm >= 11.5.1 and Node 22.14 ships 10.x.
      # Pinned to 11 rather than latest: npm 12 requires Node >= 22.22, which
      # would silently couple releases to a .nvmrc bump.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # The tag is the release contract: fail loudly rather than publish a
      # version that doesn't match what was tagged.
      - name: Check tag matches packages/sdk/package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG does not match packages/sdk/package.json version $PKG_VERSION"
            exit 1
          fi

      # Never publish something that hasn't passed the same gate CI runs.
      - run: pnpm verify

      - run: pnpm build

      # No token. npm Trusted Publishing authenticates this workflow by its OIDC
      # identity, which is why `id-token: write` is granted above. Configure the
      # trusted publisher once on npmjs.com (package → Settings → Trusted
      # Publisher: repository iamnotdou/bound, workflow release.yml).
      #
      # This replaces NPM_TOKEN deliberately. A token has to bypass the account's
      # 2FA to work unattended, which repeatedly failed here with EOTP; OIDC has
      # no second factor to bypass because there is no shared secret at all.
      - name: Publish @bound/sdk
        working-directory: packages/sdk
        run: npm publish --provenance --access public

      # @bound/mcp depends on @bound/sdk as `workspace:*`, which npm cannot
      # resolve and would happily publish verbatim — an installable package that
      # is impossible to install. `pnpm pack` rewrites the protocol to the
      # SDK version in this checkout, which is the version the step above just
      # published, so the tarball is self-consistent by construction.
      #
      # Then `npm publish <tarball>`, not `pnpm publish`: the upload has to go
      # through the npm CLI pinned above, because that is what Trusted
      # Publishing authenticates. Packing and publishing are deliberately two
      # different tools here, each doing the one thing it is trusted for.
      - name: Pack @bound/mcp
        run: pnpm --filter @bound/mcp pack --pack-destination "$RUNNER_TEMP"

      - name: Check the packed connector pins a real SDK version
        run: |
          TARBALL="$(ls "$RUNNER_TEMP"/bound-mcp-*.tgz)"
          DEP="$(tar -xzOf "$TARBALL" package/package.json | node -p \
            "JSON.parse(require('fs').readFileSync(0,'utf8')).dependencies['@bound/sdk']")"
          SDK_VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          if [ "$DEP" != "$SDK_VERSION" ]; then
            echo "::error::@bound/mcp pins @bound/sdk@$DEP, but this release publishes $SDK_VERSION"
            exit 1
          fi

      - name: Publish @bound/mcp
        run: npm publish "$(ls "$RUNNER_TEMP"/bound-mcp-*.tgz)" --provenance --access public
